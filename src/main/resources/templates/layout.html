<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:fragment="layout">
<head>
    <meta charset="UTF-8" />
    <!-- Fragmento para que las vistas hijas sobrescriban el título -->
    <title layout:fragment="title" th:text="#{gastosApp}"></title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/all.min.css}" />           <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/sb-admin-2.min.css" />
    <link rel="stylesheet" th:href="@{/css/custom.css}" />

</head>
<body>
<!-- Navbar sencillo -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4" sec:authorize="isAuthenticated()">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/gastosList}" th:text="#{gastosApp}"></a>
        <!-- Menú Utilidades (sólo OWNER), se despliega al pasar el ratón -->
        <ul class="navbar-nav me-auto" sec:authorize="hasRole('OWNER')">
            <li class="nav-item dropdown dropdown-hover">
                <a class="nav-link dropdown-toggle" href="#" role="button" th:text="#{utilidades}"></a>
                <ul class="dropdown-menu">
                    <li class="dropdown-submenu">
                        <a class="dropdown-item dropdown-toggle" href="#" th:text="#{usuarios}"></a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item d-flex align-items-center" th:href="@{/usuarios/nuevo}">
                                    <i class="fas fa-user-plus me-2"></i>
                                    <span th:text="#{nuevo}"></span>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/usuarios/consulta}" th:text="#{consulta}"></a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
    <ul class="navbar-nav ms-auto">

        <!-- Selector de idioma -->
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center"
               href="#" role="button" data-bs-toggle="dropdown">
                <i class="fas fa-globe me-1"></i>
                <span th:text="${#strings.toUpperCase(#locale.language)}"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <a class="dropdown-item d-flex align-items-center" th:classappend="${#locale.language == 'es'} ? 'active'" href="?lang=es">
                        <img th:src="@{/img/flags/es.svg}" alt="" class="me-2 border" style="width:21px; height:14px;">Español
                    </a>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center" th:classappend="${#locale.language == 'en'} ? 'active'" href="?lang=en">
                        <img th:src="@{/img/flags/gb.svg}" alt="" class="me-2 border" style="width:21px; height:14px;">English
                    </a>
                </li>
            </ul>
        </li>
        <!-- info usuario -->
        <li th:insert="~{fragments/user-info :: userInfo}"></li>
    </ul>
</nav>

<!-- Mensajes flash -->
<div class="container">
    <div th:if="${success}"
         class="alert alert-success position-fixed top-0 end-0 m-3"
         style="max-width: 250px; width: auto;"
         role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}"
         class="alert alert-danger position-fixed top-0 end-0 m-3"
         style="max-width: 250px; width: auto;"
         role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<div class="container">
    <!-- Fragmento para que las vistas hijas incrusten su contenido aquí -->
    <section layout:fragment="content">
        <!-- contenido por defecto (vacío) -->
    </section>
</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
